name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      assets_zip_url:
        description: "URL de TU copia del juego en .zip (opcional). Solo se extrae y analiza en el runner: no se empaqueta en el APK ni se sube como artefacto."
        required: false
        type: string

jobs:
  desktop:
    name: Tests de escritorio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilar y probar el VFS
        run: |
          cmake -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Extraer y analizar el zip del juego (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.assets_zip_url != '' }}
        env:
          ASSETS_ZIP_URL: ${{ inputs.assets_zip_url }}
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/game.zip" "$ASSETS_ZIP_URL"
          python3 tools/extract_zip.py "$RUNNER_TEMP/game.zip" "$RUNNER_TEMP/game"
          python3 tools/scan_assets.py "$RUNNER_TEMP/game"

  android:
    name: APK debug
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # SDK propio e independiente de la imagen del runner.
      - name: Instalar Android SDK, NDK y CMake
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdtools"
          mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          # Se usa gradle directo; el único wrapper del repo es el de ejemplo de SDL2.
          validate-wrappers: false

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sprally-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
